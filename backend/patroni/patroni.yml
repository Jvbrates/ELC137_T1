scope: pgcluster
name: patroni-node

restapi:
  listen: 0.0.0.0:8008
  connect_address: 0.0.0.0:8008

etcd3:
  hosts: 
    - etcd1:2379
    - etcd2:2379
    - etcd3:2379

postgresql:
  listen: 0.0.0.0:5432
  connect_address: 0.0.0.0:5432
  data_dir: /var/lib/postgresql/data
  bin_dir: /usr/lib/postgresql/15/bin
  authentication:
    superuser:
      username: postgres
      password: ""
    replication:
      username: postgres
      password: ""

bootstrap:
  dcs:
    postgresql:
      use_pg_rewind: true
      parameters:
        wal_level: replica
        max_wal_senders: 10
        hot_standby: "on"
  initdb:
    - encoding: UTF8
    - data-checksums
  post_init: /etc/post-init.sql

